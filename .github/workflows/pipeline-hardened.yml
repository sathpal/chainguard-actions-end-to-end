# AFTER: the same pipeline on Chainguard Actions. Generated by scripts/regen-hardened.sh from pipeline-upstream.yml;
# do not edit by hand. Every action is a hardened copy built from the exact upstream commit of that version, pinned
# here by commit SHA with the version as a comment. Chainguard re-hardens versions in place and moves their tags,
# so the SHA is the only immutable reference; Dependabot (.github/dependabot.yml) proposes new SHAs as pull requests.
name: pipeline (Chainguard Actions, pinned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile", ".github/workflows/pipeline-*.yml"]

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}/hello
  FLAVOR: hardened

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: chainguard-actions/actions-checkout@279383ec3b8d70f964ffa5a2151ea3d2a5317ec6 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changed
        uses: chainguard-actions/tj-actions-changed-files@4b4bd2ed96c7629e1c911f97f2390b91e1362735 # v47
        with:
          files: |
            app/**
            Dockerfile
      - name: Show what changed
        env:
          ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          echo "app changed: ${ANY_CHANGED}; files: ${CHANGED_FILES}"

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: chainguard-actions/actions-checkout@279383ec3b8d70f964ffa5a2151ea3d2a5317ec6 # v7.0.1
        with:
          persist-credentials: false
      - uses: chainguard-actions/actions-setup-go@738fd0174f4ff963ac8c2e9dfe83e3191b2777fb # v7.0.0
        with:
          go-version-file: app/go.mod
          cache: false
      - name: Unit tests
        working-directory: app
        run: go vet ./... && go test -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: chainguard-actions/actions-checkout@279383ec3b8d70f964ffa5a2151ea3d2a5317ec6 # v7.0.1
        with:
          persist-credentials: false
      - uses: chainguard-actions/docker-setup-buildx-action@9e5cde6a2bfeda6fa52c81f71365a9271a46fce0 # v4.4.1
      - uses: chainguard-actions/docker-login-action@471f865b6525577aec1a207ce43d4ec3ed8a996d # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: chainguard-actions/docker-metadata-action@897c7d20d500ba5c444ff537bcce1278724b6c96 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=${{ env.FLAVOR }}-,format=long
      - id: push
        uses: chainguard-actions/docker-build-push-action@5b225cb1d6f5196bc2459eaa52642b902bf3750f # v7.4.0
        with:
          context: .
          push: true
          build-args: BUILT_BY=${{ env.FLAVOR }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: SBOM (syft)
        uses: chainguard-actions/anchore-sbom-action@f26b93287efafa8b3ffa0ae62eead21c63f58e35 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ env.FLAVOR }}.spdx.json
      - name: Scan gate (grype)
        uses: chainguard-actions/anchore-scan-action@6fd51fc1c2c6421ef0c9bbc53c990b14c931148a # v7.4.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Second opinion (trivy)
        uses: chainguard-actions/aquasecurity-trivy-action@c02135b2a61e8a6d603c53db55145af34b25ce4d # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p out
          printf '{"image":"%s","digest":"%s","flavor":"%s"}\n' "$IMAGE" "$DIGEST" "$FLAVOR" > out/build.json
          cat out/build.json
      - uses: chainguard-actions/actions-upload-artifact@dc8d35a3347d79eda9033e7af73f508094dd41b5 # v7.0.1
        with:
          name: build-${{ env.FLAVOR }}
          path: out/build.json

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: chainguard-actions/sigstore-cosign-installer@b87981cc3b0232e11827d1a8c6bcfa63d6cbd97a # v4.1.2
      - uses: chainguard-actions/docker-login-action@471f865b6525577aec1a207ce43d4ec3ed8a996d # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign keyless and verify
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            | jq -r '.[0].optional | "verified: signed by \(.Subject) at commit \(.githubWorkflowSha)"'
      - name: GitHub build provenance
        uses: chainguard-actions/actions-attest-build-provenance@8328d5e203fef634d47821ee4ace277c71134569 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
