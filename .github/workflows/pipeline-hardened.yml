# AFTER: the same pipeline on Chainguard Actions. Generated from pipeline-upstream.yml by scripts/regen-hardened.sh
# (the one-time migration); from then on Dependabot maintains the pins. Every action is a hardened copy built from
# the exact upstream commit of that version, pinned by commit SHA with the version as a comment. Chainguard
# re-hardens versions in place and moves their tags, so the SHA is the only immutable reference; Dependabot
# (.github/dependabot.yml) proposes each new hardening as a pull request, and this pipeline tests it there.
name: pipeline (Chainguard Actions, pinned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile", ".github/workflows/pipeline-*.yml"]
  pull_request:
    paths: ["app/**", "Dockerfile", ".github/workflows/pipeline-*.yml"]

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}/hello
  FLAVOR: hardened
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changed
        uses: chainguard-actions/tj-actions-changed-files@42a2b04baae2d5e39d2429299f622b7f01f8420d # v47
        with:
          files: |
            app/**
            Dockerfile
      - name: Show what changed
        env:
          ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          echo "app changed: ${ANY_CHANGED}; files: ${CHANGED_FILES}"

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false
      - uses: chainguard-actions/actions-setup-go@a23f604fa6ac04bc887d814b1cf828c9fbaf51a7 # v7.0.0
        with:
          go-version-file: app/go.mod
          cache: false
      - name: Unit tests
        working-directory: app
        run: go vet ./... && go test -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false
      - uses: chainguard-actions/docker-setup-buildx-action@9744db81e7643f97efc7d98e7ce3d11d197f3093 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: chainguard-actions/docker-login-action@e866ef65062739486ea6d830a9cd5957df29abea # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: chainguard-actions/docker-metadata-action@f00cce7d85a292451bbab8346cddfdfb3a7b0ea4 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=${{ env.FLAVOR }}-,format=long
      - id: push
        uses: chainguard-actions/docker-build-push-action@7a9792a1d0d1c43df643ef18b1f3a4a495833b23 # v7.4.0
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          build-args: BUILT_BY=${{ env.FLAVOR }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - id: ref
        name: Image to scan (pushed digest on main, local image on a pull request)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          LOCAL: ${{ steps.meta.outputs.tags }}
        run: |
          if [ "$PUBLISH" = true ]; then echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"; else echo "ref=${LOCAL}" >> "$GITHUB_OUTPUT"; fi
      - name: SBOM (syft)
        uses: chainguard-actions/anchore-sbom-action@f26b93287efafa8b3ffa0ae62eead21c63f58e35 # v0
        with:
          image: ${{ steps.ref.outputs.ref }}
          format: spdx-json
          artifact-name: sbom-${{ env.FLAVOR }}.spdx.json
      - name: Scan gate (grype)
        uses: chainguard-actions/anchore-scan-action@c0ec3af557c5684f75ff122d1560e8de876c57ae # v7.4.2
        with:
          image: ${{ steps.ref.outputs.ref }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Second opinion (trivy)
        uses: chainguard-actions/aquasecurity-trivy-action@48605fdca0f5553f0ddedf3301fce2681397ff3d # v0.35.0
        with:
          image-ref: ${{ steps.ref.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Record what was built
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          mkdir -p out
          printf '{"ref":"%s","flavor":"%s","published":%s}\n' "$REF" "$FLAVOR" "$PUBLISH" > out/build.json
          cat out/build.json
      - uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.1
        with:
          name: build-${{ env.FLAVOR }}
          path: out/build.json

  sign:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: chainguard-actions/sigstore-cosign-installer@634c2f027906fc3f2a3bb29ca604080e1b2eab86 # v4.1.3
      - uses: chainguard-actions/docker-login-action@e866ef65062739486ea6d830a9cd5957df29abea # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign keyless and verify
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            | jq -r --arg id "${identity}" '.[0].critical.image["docker-manifest-digest"] | "verified \(.) signed by \($id)"'
      - name: GitHub build provenance
        uses: chainguard-actions/actions-attest-build-provenance@e525ec1a4156b85024a67fd8acc21021e8a3c9b6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
